services:
  mihon-sync:
    build: .
    container_name: mihon-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    # Keys can only be created from a local network or through an invite.
    # With "loopback" (the default), create invites instead:
    #   docker exec mihon-sync mihon-sync invite create
    # Or temporarily switch this to "private" to generate the first key from
    # a device on your LAN, only while the port is not exposed publicly.
    command: ["serve", "--data", "/data", "--addr", ":8080", "--bootstrap-network", "loopback"]
